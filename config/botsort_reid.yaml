tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: true

# Compensate for camera motion while the chassis turns.
gmc_method: sparseOptFlow
proximity_thresh: 0.35
appearance_thresh: 0.8
with_reid: true
# Reuse the YOLO detector's features to keep CPU inference lightweight.
model: auto
