name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Run controller and release tests
        run: python -B -m pytest -q -p no:cacheprovider
      - name: Check Python syntax
        run: python -m compileall -q src ops tests
      - name: Check Bash syntax
        if: runner.os == 'Linux'
        run: |
          for script in ops/*.sh
          do
            bash -n "$script"
          done
